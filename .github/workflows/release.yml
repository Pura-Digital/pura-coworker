name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Apply patches
        run: npx patch-package

      - name: Build native modules for tests
        run: npm rebuild better-sqlite3

      - name: Lint
        run: npm run lint

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Test with Coverage
        run: npm run test:coverage

  build-macos:
    name: Release macOS
    needs: [lint-and-test]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm

      - name: Cache Electron
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/Library/Caches/electron
          key: electron-mac-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-mac-

      - name: Install dependencies
        run: npm ci

      - name: Install cliclick for GUI tools
        run: brew install cliclick

      - name: Download Node binaries (arm64 + x64)
        run: node scripts/download-node.js --all-darwin

      - name: Prepare Python runtime (arm64 + x64)
        run: node scripts/prepare-python.js --all

      - name: Prepare GUI tools (arm64 + x64)
        run: node scripts/prepare-gui-tools.js --all

      - name: Build Lima agent
        run: npm run build:lima-agent

      - name: Build MCP servers
        run: npm run build:mcp

      - name: TypeScript compile
        run: npx tsc

      - name: Vite build
        run: npx vite build

      - name: Pre-build check (arm64 + x64 resources)
        run: node scripts/pre-build-check.js --all-darwin

      - name: Verify macOS signing credentials
        run: bash scripts/verify-macos-signing-env.sh
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Electron Builder (signed + notarized)
        run: npx electron-builder --mac dmg zip dir --arm64 --x64 --publish never
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Generate latest-mac.yml
        run: node scripts/generate-latest-mac-yml.js

      - name: List release artifacts
        run: |
          set -euo pipefail
          echo "release/ contents:"
          ls -la release/
          echo "latest-mac.yml:"
          cat release/latest-mac.yml

      - name: Verify macOS release artifacts
        run: bash scripts/verify-mac-release-artifacts.sh

      - name: Smoke test - launch app (arm64)
        run: |
          set -euo pipefail
          if [ -d release/mac-arm64 ]; then
            bash scripts/mac-smoke-test.sh release/mac-arm64 launch
          else
            echo "release/mac-arm64 not found; skipping launch smoke test (zip artifacts already verified)"
          fi

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          make_latest: true
          overwrite: true
          files: |
            release/*.dmg
            release/*.zip
            release/latest-mac.yml
            release/*.zip.blockmap

  build-windows:
    name: Release Windows
    needs: [lint-and-test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm

      - name: Cache Electron
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/AppData/Local/electron/Cache
          key: electron-win-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-win-

      - name: Install dependencies
        run: npm ci

      - name: Download Node binaries
        run: node scripts/download-node.js

      - name: Build WSL agent
        run: npm run build:wsl-agent

      - name: Build MCP servers
        run: npm run build:mcp

      - name: TypeScript compile
        run: npx tsc

      - name: Vite build
        run: npx vite build

      - name: Electron Builder
        run: npx electron-builder --win nsis --publish never

      # Verify critical resources are present in the packaged app
      - name: Smoke test - verify packaged resources
        shell: pwsh
        run: |
          $unpackedDir = "release\win-unpacked"
          if (-not (Test-Path $unpackedDir)) {
            Write-Host "::warning::win-unpacked directory not found, skipping resource check"
            exit 0
          }

          $resourcesDir = Join-Path $unpackedDir "resources"
          Write-Host "Checking resources in: $resourcesDir"

          $checks = @(
            "mcp\gui-operate-server.js",
            "mcp\software-dev-server-example.js",
            "node\node.exe",
            "wsl-agent\index.js",
            "skills"
          )

          $failed = $false
          foreach ($check in $checks) {
            $fullPath = Join-Path $resourcesDir $check
            if (Test-Path $fullPath) {
              Write-Host "  OK: $check"
            } else {
              Write-Host "::error::Missing resource: $check"
              $failed = $true
            }
          }

          if ($failed) {
            Write-Host "::error::Packaged app is missing critical resources"
            exit 1
          }
          Write-Host "All packaged resources verified."

      - name: Smoke test - launch app
        shell: pwsh
        run: |
          $unpackedDir = "release\win-unpacked"
          $exe = Get-ChildItem -Path $unpackedDir -Filter "*.exe" | Where-Object { $_.Name -notmatch 'Uninstall' } | Select-Object -First 1
          if (-not $exe) {
            Write-Host "::error::No exe found in win-unpacked"
            exit 1
          }
          Write-Host "Launching: $($exe.FullName) --smoke-test"
          $proc = Start-Process -FilePath $exe.FullName -ArgumentList "--smoke-test" -PassThru
          if (-not $proc.WaitForExit(30000)) {
            $proc.Kill($true)
            Write-Host "::error::Launch smoke test timed out after 30s"
            exit 1
          }
          if ($proc.ExitCode -eq 0) {
            Write-Host "Launch smoke test passed"
          } else {
            Write-Host "::error::Launch smoke test failed with exit code $($proc.ExitCode)"
            exit 1
          }

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          make_latest: true
          overwrite: true
          files: |
            release/*.exe
            release/latest.yml
            release/*.exe.blockmap
