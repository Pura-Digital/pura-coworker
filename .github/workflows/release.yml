name: Release
run-name: Release ${{ inputs.release_tag || github.ref_name }} (${{ inputs.arm64_runner || vars.MACOS_ARM64_RUNNER || 'macos-26' }})

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build (for example v3.5.1)
        required: true
        type: string
      arm64_runner:
        description: macOS ARM64 runner image
        required: true
        default: macos-26
        type: choice
        options:
          - macos-26
          - macos-15
          - pura-release-arm64
      runtime_run_id:
        description: Optional original tag run whose successful runtime artifacts should be reused
        required: false
        type: string

permissions:
  contents: write
  actions: read

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
  MACOSX_DEPLOYMENT_TARGET: '14.0'

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Verify release tag matches app version
        run: |
          node - <<'JS'
          const expected = `v${require('./package.json').version}`;
          if (process.env.RELEASE_TAG !== expected) {
            throw new Error(`Release tag ${process.env.RELEASE_TAG} does not match ${expected}`);
          }
          JS

      - name: Verify reusable runtime artifacts match the release commit
        if: inputs.runtime_run_id != ''
        env:
          RUNTIME_RUN_ID: ${{ inputs.runtime_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node - <<'JS'
          const { execFileSync } = require('node:child_process');
          (async () => {
            const id = process.env.RUNTIME_RUN_ID;
            if (!/^\d+$/.test(id)) throw new Error('Runtime run ID must be numeric');
            const base = `${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}`;
            async function get(path) {
              const response = await fetch(`${base}/${path}`, {
                headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json' },
              });
              if (!response.ok) throw new Error(`Cannot verify runtime source: HTTP ${response.status}`);
              return response.json();
            }
            const source = await get(`actions/runs/${id}`);
            const commit = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
            if (source.head_sha !== commit) throw new Error('Runtime artifacts must come from the same release commit');
            const { jobs } = await get(`actions/runs/${id}/jobs?per_page=100`);
            const { artifacts } = await get(`actions/runs/${id}/artifacts?per_page=100`);
            for (const target of ['darwin-arm64', 'darwin-x64', 'win32-x64']) {
              if (!jobs.some(job => job.name === `PII runtime (${target})` && job.conclusion === 'success')) {
                throw new Error(`Runtime build did not succeed: ${target}`);
              }
              if (!artifacts.some(artifact => artifact.name === `pii-runtime-${target}` && !artifact.expired)) {
                throw new Error(`Runtime artifact is unavailable: ${target}`);
              }
            }
            console.log(`Verified runtime artifacts from run ${id} at ${commit}`);
          })().catch(error => { console.error(error.message); process.exitCode = 1; });
          JS

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Apply patches
        run: npx patch-package

      - name: Build native modules for tests
        run: npm rebuild better-sqlite3

      - name: Lint
        run: npm run lint

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Test with Coverage
        run: npm run test:coverage

  anonymization-runtimes:
    name: PII runtime (${{ matrix.target }})
    if: inputs.runtime_run_id == ''
    needs: [lint-and-test]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ${{ inputs.arm64_runner || vars.MACOS_ARM64_RUNNER || 'macos-26' }}
            target: darwin-arm64
          - runner: macos-15-intel
            target: darwin-x64
          - runner: windows-latest
            target: win32-x64
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: matrix.runner != 'pura-release-arm64'
        with:
          python-version: '3.11'
      - name: Verify Python on dedicated ARM64 runner
        if: matrix.runner == 'pura-release-arm64'
        run: python -c "import platform, sys; assert sys.version_info >= (3, 11), 'Python 3.11+ required'; assert platform.machine() == 'arm64', 'ARM64 Python required'"
      - name: Build private offline CPU worker
        run: python scripts/prepare-anonymization.py
      - name: Build native system storage authorization
        run: node scripts/prepare-keychain.js
      - name: Archive runtime preserving symbolic links and permissions
        shell: bash
        env:
          RUNTIME_TARGET: ${{ matrix.target }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tarfile
          target = os.environ['RUNTIME_TARGET']
          root = pathlib.Path('.bundle-resources/anonymization')
          with tarfile.open(root / f'pii-runtime-{target}.tar.gz', 'w:gz', dereference=False) as archive:
              archive.add(root / target, arcname=target)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pii-runtime-${{ matrix.target }}
          path: .bundle-resources/anonymization/pii-runtime-${{ matrix.target }}.tar.gz
          compression-level: 0
          if-no-files-found: error

  build-macos:
    name: Release macOS
    needs: [lint-and-test, anonymization-runtimes]
    if: ${{ !cancelled() && needs.lint-and-test.result == 'success' && (needs.anonymization-runtimes.result == 'success' || (needs.anonymization-runtimes.result == 'skipped' && inputs.runtime_run_id != '')) }}
    runs-on: ${{ inputs.arm64_runner || vars.MACOS_ARM64_RUNNER || 'macos-26' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: ${{ (inputs.arm64_runner || vars.MACOS_ARM64_RUNNER) != 'pura-release-arm64' && 'npm' || '' }}
          package-manager-cache: ${{ (inputs.arm64_runner || vars.MACOS_ARM64_RUNNER) != 'pura-release-arm64' }}

      - name: Cache Electron
        if: (inputs.arm64_runner || vars.MACOS_ARM64_RUNNER) != 'pura-release-arm64'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/Library/Caches/electron
          key: electron-mac-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-mac-

      - name: Install dependencies
        run: npm ci

      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          name: pii-runtime-darwin-arm64
          path: .bundle-resources/anonymization
          github-token: ${{ github.token }}
          run-id: ${{ inputs.runtime_run_id || github.run_id }}
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          name: pii-runtime-darwin-x64
          path: .bundle-resources/anonymization
          github-token: ${{ github.token }}
          run-id: ${{ inputs.runtime_run_id || github.run_id }}
      - name: Extract macOS runtimes preserving framework structure
        run: |
          tar -xzf .bundle-resources/anonymization/pii-runtime-darwin-arm64.tar.gz -C .bundle-resources/anonymization
          tar -xzf .bundle-resources/anonymization/pii-runtime-darwin-x64.tar.gz -C .bundle-resources/anonymization

      - name: Install cliclick for GUI tools
        run: brew install cliclick

      - name: Download Node binaries (arm64 + x64)
        run: node scripts/download-node.js --all-darwin

      - name: Prepare Python runtime (arm64 + x64)
        run: node scripts/prepare-python.js --all

      - name: Prepare GUI tools (arm64 + x64)
        run: node scripts/prepare-gui-tools.js --all

      - name: Build Lima agent
        run: npm run build:lima-agent

      - name: Build MCP servers
        run: npm run build:mcp

      - name: TypeScript compile
        run: npx tsc

      - name: Vite build
        run: npx vite build

      - name: Pre-build check (arm64 + x64 resources)
        run: node scripts/pre-build-check.js --all-darwin

      - name: Prepare macOS signing keychain
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${CSC_LINK:?Missing signing certificate}"
          : "${CSC_KEY_PASSWORD:?Missing certificate password}"
          umask 077
          P12_PATH="$(mktemp "$RUNNER_TEMP/pura-signing.XXXXXX.p12")"
          KEYCHAIN_PATH="$RUNNER_TEMP/pura-signing-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.keychain-db"
          PREPARED=0
          cleanup() {
            rm -f "$P12_PATH"
            if [ "$PREPARED" != 1 ]; then
              security delete-keychain "$KEYCHAIN_PATH" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT
          node -e 'require("node:fs").writeFileSync(process.argv[1], Buffer.from(process.env.CSC_LINK, "base64"))' "$P12_PATH"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$P12_PATH" -k "$KEYCHAIN_PATH" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          node - "$KEYCHAIN_PATH" <<'JS'
          const { execFileSync } = require('node:child_process');
          const existing = execFileSync('security', ['list-keychains', '-d', 'user'], { encoding: 'utf8' })
            .split('\n').map(line => line.trim()).filter(Boolean).map(line => JSON.parse(line));
          execFileSync('security', ['list-keychains', '-d', 'user', '-s', process.argv[2], ...existing]);
          JS
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk '/Developer ID Application/ {print $2; exit}')"
          : "${IDENTITY:?No Developer ID Application identity found}"
          PROBE_PATH="$RUNNER_TEMP/pura-signing-probe"
          cp /usr/bin/true "$PROBE_PATH"
          codesign --force --sign "$IDENTITY" --keychain "$KEYCHAIN_PATH" --timestamp "$PROBE_PATH"
          codesign --verify --strict "$PROBE_PATH"
          rm -f "$PROBE_PATH"
          printf 'CSC_KEYCHAIN=%s\n' "$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          PREPARED=1

      - name: Electron Builder (signed + notarized)
        shell: bash
        run: |
          ulimit -Sn 10240 || true
          node - <<'JS'
          const fs = require('node:fs');
          const path = require('node:path');
          const preload = path.join(process.env.RUNNER_TEMP, 'pura-build-fs.cjs');
          fs.writeFileSync(preload, `require(${JSON.stringify(require.resolve('graceful-fs'))}).gracefulify(require('node:fs'));\n`);
          JS
          node --require "$RUNNER_TEMP/pura-build-fs.cjs" node_modules/electron-builder/cli.js --mac dmg zip dir --arm64 --x64 --publish never
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Generate latest-mac.yml
        run: node scripts/generate-latest-mac-yml.js

      - name: List release artifacts
        run: |
          set -euo pipefail
          echo "release/ contents:"
          ls -la release/
          echo "latest-mac.yml:"
          cat release/latest-mac.yml

      - name: Verify macOS release artifacts
        run: bash scripts/verify-mac-release-artifacts.sh

      - name: Smoke test - launch app (arm64)
        run: |
          set -euo pipefail
          if [ -d release/mac-arm64 ]; then
            bash scripts/mac-smoke-test.sh release/mac-arm64 launch
          else
            echo "release/mac-arm64 not found; skipping launch smoke test (zip artifacts already verified)"
          fi

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          draft: false
          make_latest: true
          overwrite: true
          files: |
            release/*.dmg
            release/*.zip
            release/latest-mac.yml
            release/*.zip.blockmap

      - name: Remove macOS signing keychain
        if: always()
        shell: bash
        run: |
          if [ -n "${CSC_KEYCHAIN:-}" ]; then
            security delete-keychain "$CSC_KEYCHAIN"
          fi

  build-windows:
    name: Release Windows
    needs: [lint-and-test, anonymization-runtimes]
    if: ${{ !cancelled() && needs.lint-and-test.result == 'success' && (needs.anonymization-runtimes.result == 'success' || (needs.anonymization-runtimes.result == 'skipped' && inputs.runtime_run_id != '')) }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm

      - name: Cache Electron
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/AppData/Local/electron/Cache
          key: electron-win-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-win-

      - name: Install dependencies
        run: npm ci

      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          name: pii-runtime-win32-x64
          path: .bundle-resources/anonymization
          github-token: ${{ github.token }}
          run-id: ${{ inputs.runtime_run_id || github.run_id }}
      - name: Extract Windows runtime
        run: tar -xzf .bundle-resources/anonymization/pii-runtime-win32-x64.tar.gz -C .bundle-resources/anonymization

      - name: Download Node binaries
        run: node scripts/download-node.js

      - name: Build WSL agent
        run: npm run build:wsl-agent

      - name: Build MCP servers
        run: npm run build:mcp

      - name: TypeScript compile
        run: npx tsc

      - name: Vite build
        run: npx vite build

      - name: Electron Builder
        run: npx electron-builder --win nsis --publish never

      # Verify critical resources are present in the packaged app
      - name: Smoke test - verify packaged resources
        shell: pwsh
        run: |
          $unpackedDir = "release\win-unpacked"
          if (-not (Test-Path $unpackedDir)) {
            Write-Host "::warning::win-unpacked directory not found, skipping resource check"
            exit 0
          }

          $resourcesDir = Join-Path $unpackedDir "resources"
          Write-Host "Checking resources in: $resourcesDir"

          $checks = @(
            "mcp\gui-operate-server.js",
            "mcp\software-dev-server-example.js",
            "node\node.exe",
            "wsl-agent\index.js",
            "skills"
          )

          $failed = $false
          foreach ($check in $checks) {
            $fullPath = Join-Path $resourcesDir $check
            if (Test-Path $fullPath) {
              Write-Host "  OK: $check"
            } else {
              Write-Host "::error::Missing resource: $check"
              $failed = $true
            }
          }

          if ($failed) {
            Write-Host "::error::Packaged app is missing critical resources"
            exit 1
          }
          Write-Host "All packaged resources verified."

      - name: Smoke test - launch app
        shell: pwsh
        run: |
          $unpackedDir = "release\win-unpacked"
          $exe = Get-ChildItem -Path $unpackedDir -Filter "*.exe" | Where-Object { $_.Name -notmatch 'Uninstall' } | Select-Object -First 1
          if (-not $exe) {
            Write-Host "::error::No exe found in win-unpacked"
            exit 1
          }
          Write-Host "Launching: $($exe.FullName) --smoke-test"
          $proc = Start-Process -FilePath $exe.FullName -ArgumentList "--smoke-test" -PassThru
          if (-not $proc.WaitForExit(30000)) {
            $proc.Kill($true)
            Write-Host "::error::Launch smoke test timed out after 30s"
            exit 1
          }
          if ($proc.ExitCode -eq 0) {
            Write-Host "Launch smoke test passed"
          } else {
            Write-Host "::error::Launch smoke test failed with exit code $($proc.ExitCode)"
            exit 1
          }

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          draft: false
          make_latest: true
          overwrite: true
          files: |
            release/*.exe
            release/latest.yml
            release/*.exe.blockmap
